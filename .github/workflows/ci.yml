name: CI

on:
  pull_request:
  push:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: llm-service-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-1
  SLS_DISABLE_AUTO_UPDATE: '1'

jobs:
  check:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    # DynamoDB Local for the store tests (src/lib/store/dynamo/dynamo.spec.ts). The image is
    # amazon/dynamodb-local; -inMemory keeps it stateless.
    services:
      dynamodb:
        image: amazon/dynamodb-local:2.5.4
        ports:
          - 8000:8000
    env:
      TEST_DYNAMODB_ENDPOINT: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Typecheck
        run: yarn typecheck
      - name: Test service
        run: yarn test --coverage
      - name: Typecheck contracts
        run: yarn workspace @talvio/llm-contracts typecheck
      - name: Test contracts
        run: yarn test:contracts

  # Like media-service and email-service: a push to `development` (or a manual run on it) deploys
  # stage dev once the checks pass. Needs the dev platform from talvio-terraform-iac and the
  # llm deploy role in the dev Environment's AWS_DEPLOY_ROLE_ARN; without it the job only says so.
  deploy-dev:
    name: deploy (dev)
    needs: check
    if: |
      github.ref == 'refs/heads/development' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: dev
    env:
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Skip deploy (no AWS_DEPLOY_ROLE_ARN)
        if: env.ROLE_ARN == ''
        run: echo "Set the dev environment variable AWS_DEPLOY_ROLE_ARN to the llm_deploy_role_arn output (SSM /dev/ci/llm-deploy-role-arn)." >> "$GITHUB_STEP_SUMMARY"
      - name: Configure AWS (OIDC)
        if: env.ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy
        if: env.ROLE_ARN != ''
        run: yarn sls deploy --stage dev --verbose

  # Like media-service and email-service: a push to `main` (or a manual run on it) deploys
  # stage prod once the checks pass. Needs the prod platform from talvio-terraform-iac and the
  # llm deploy role in the prod Environment's AWS_DEPLOY_ROLE_ARN; without it the job only says so.
  deploy-prod:
    name: deploy (prod)
    needs: check
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: prod
    env:
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
      SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn
        run: corepack enable
      - name: Install
        run: yarn install --immutable
      - name: Skip deploy (no AWS_DEPLOY_ROLE_ARN)
        if: env.ROLE_ARN == ''
        run: echo "Set the prod environment variable AWS_DEPLOY_ROLE_ARN to the llm_deploy_role_arn output (SSM /prod/ci/llm-deploy-role-arn)." >> "$GITHUB_STEP_SUMMARY"
      - name: Configure AWS (OIDC)
        if: env.ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy
        if: env.ROLE_ARN != ''
        run: yarn sls deploy --stage prod --verbose
